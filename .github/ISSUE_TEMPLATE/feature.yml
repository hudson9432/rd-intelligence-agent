name: Feature or roadmap phase
description: Propose a scoped product or engineering change
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Read AGENTS.md and docs/ROADMAP.md before claiming this issue.
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: Describe user-visible behavior, not only implementation steps.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and boundaries
      description: State what is included and explicitly excluded.
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Contracts or data changes
      description: List affected APIs, schemas, settings, or write "None".
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide concrete, testable completion criteria.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required tests
      description: List unit, API, integration, and frontend checks.
    validations:
      required: true
