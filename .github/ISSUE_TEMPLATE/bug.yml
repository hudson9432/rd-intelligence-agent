name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Remove API keys, tokens, private source data, and other secrets.
  - type: textarea
    id: verification
    attributes:
      label: Fix acceptance criteria
      placeholder: |
        - [ ] Regression test added
        - [ ] Backend/frontend verification passes
    validations:
      required: true
